<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazuna Gomoku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #171b26;
            --bg-card: #1f2433;
            --bg-card-hover: #262d3f;
            --border-color: #2e364b;
            --accent-gold: #e5b95f;
            --accent-gold-glow: rgba(229, 185, 95, 0.35);
            --accent-cyan: #38bdf8;
            --accent-red: #f43f5e;
            --accent-green: #10b981;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --shadow-lg: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1a2234 0%, var(--bg-primary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 36px;
            background: rgba(23, 27, 38, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #a8a8a8 40%, #1e1e1e 100%);
            box-shadow: 0 0 16px var(--accent-gold-glow), 0 4px 8px rgba(0,0,0,0.5);
            border: 2px solid var(--accent-gold);
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(229, 185, 95, 0.15);
            color: var(--accent-gold);
            border: 1px solid rgba(229, 185, 95, 0.3);
            letter-spacing: 0.5px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            font-weight: 500;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .pulse-dot.thinking {
            background: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan);
            animation: pulse-anim 1.2s infinite ease-in-out;
        }

        @keyframes pulse-anim {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.5; }
        }

        main {
            display: flex;
            flex: 1;
            padding: 24px 36px;
            gap: 32px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
            align-items: flex-start;
            justify-content: center;
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .canvas-card {
            background: #2b1f17;
            padding: 14px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg), 0 0 30px rgba(0,0,0,0.5);
            border: 3px solid #5c3a21;
            position: relative;
            cursor: pointer;
        }

        #boardCanvas {
            display: block;
            border-radius: 6px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }

        .winrate-bar-container {
            width: 100%;
            background: var(--bg-card);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .winrate-labels {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
        }

        .winrate-bar-track {
            height: 10px;
            border-radius: 5px;
            background: #222;
            overflow: hidden;
            display: flex;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .winrate-bar-fill-black {
            background: linear-gradient(90deg, #111, #444);
            height: 100%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .winrate-bar-fill-white {
            background: linear-gradient(90deg, #d1d5db, #ffffff);
            height: 100%;
            flex: 1;
        }

        .sidebar {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-gold);
        }

        .hud-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .hud-item {
            background: rgba(15, 17, 23, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
        }

        .hud-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hud-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .hud-pv {
            grid-column: span 2;
            background: rgba(15, 17, 23, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
        }

        .pv-moves {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--accent-cyan);
            word-break: break-all;
            margin-top: 4px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .btn-toggle-group {
            display: flex;
            background: rgba(15, 17, 23, 0.8);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .btn-toggle {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-toggle.active {
            background: var(--accent-gold);
            color: #111;
            box-shadow: 0 2px 8px var(--accent-gold-glow);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e5b95f 0%, #c99839 100%);
            color: #111;
            box-shadow: 0 4px 14px var(--accent-gold-glow);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background: #2f384e;
            border-color: #475569;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2e364b;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-gold);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #111;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--bg-card);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 32px 40px;
            text-align: center;
            box-shadow: var(--shadow-lg), 0 0 40px var(--accent-gold-glow);
            max-width: 420px;
            width: 90%;
            animation: modal-enter 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes modal-enter {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--accent-gold);
        }

        .modal-desc {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        @media (max-width: 1080px) {
            main {
                flex-direction: column;
                align-items: center;
            }
            .sidebar {
                width: 100%;
                max-width: 620px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <div class="brand-logo"></div>
        <div>
            <div class="brand-title">NAZUNA GOMOKU</div>
            <div style="font-size: 11px; color: var(--text-muted); font-weight: 500;">五子棋 / 连珠博弈系统</div>
        </div>
        <div class="brand-badge">EDITION</div>
    </div>

    <div class="header-status">
        <div class="status-badge" id="statusBadge">
            <div class="pulse-dot" id="statusDot"></div>
            <span id="statusText">对局进行中</span>
        </div>
    </div>
</header>

<main>
    <div class="board-container">
        <div class="canvas-card">
            <canvas id="boardCanvas" width="630" height="630"></canvas>
        </div>

        <div class="winrate-bar-container">
            <div class="winrate-labels">
                <span id="winrateBlackLabel">黑方胜率: 50.0%</span>
                <span id="winrateWhiteLabel">白方胜率: 50.0%</span>
            </div>
            <div class="winrate-bar-track">
                <div class="winrate-bar-fill-black" id="winrateBarBlack" style="width: 50%;"></div>
                <div class="winrate-bar-fill-white" id="winrateBarWhite"></div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="panel-card">
            <div class="panel-header">
                <div class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    思考引擎监控
                </div>
                <span id="openingNameBadge" style="font-size: 11px; color: var(--accent-gold); font-weight: 600;"></span>
            </div>
            <div class="hud-grid">
                <div class="hud-item">
                    <div class="hud-label">搜索深度</div>
                    <div class="hud-value" id="hudDepth">0 层</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">思考用时</div>
                    <div class="hud-value" id="hudTime">0 ms</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">搜索节点</div>
                    <div class="hud-value" id="hudNodes">0</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">算力速度</div>
                    <div class="hud-value" id="hudNps">0 nps</div>
                </div>
                <div class="hud-pv">
                    <div class="hud-label">主要变例路线 (PV Line)</div>
                    <div class="pv-moves" id="hudPvLine">等待落子...</div>
                </div>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-header">
                <div class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                    对局控制
                </div>
            </div>

            <div class="control-group">
                <div class="form-row">
                    <span class="form-label">玩家阵营</span>
                    <div class="btn-toggle-group" id="sideToggleGroup">
                        <button class="btn-toggle active" data-color="1">执黑 (先手)</button>
                        <button class="btn-toggle" data-color="2">执白 (后手)</button>
                    </div>
                </div>

                <div class="form-row">
                    <span class="form-label">AI 思考时间</span>
                    <div class="btn-toggle-group" id="timeToggleGroup">
                        <button class="btn-toggle" data-time="1">1秒</button>
                        <button class="btn-toggle active" data-time="3">3秒</button>
                        <button class="btn-toggle" data-time="5">5秒</button>
                    </div>
                </div>

                <div class="form-row">
                    <span class="form-label">连珠禁手规则</span>
                    <label class="switch">
                        <input type="checkbox" id="ruleSwitch" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="form-row">
                    <span class="form-label">显示落子序号</span>
                    <label class="switch">
                        <input type="checkbox" id="moveNumSwitch" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="btn-grid" style="margin-bottom: 12px;">
                <button class="btn btn-primary" id="btnNewGame" style="grid-column: span 2;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2v6h6"/><path d="M21 12A9 9 0 0 0 6 5.3L3 8"/><path d="M21 22v-6h-6"/><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/></svg>
                    开始新对局
                </button>
                <button class="btn btn-secondary" id="btnUndo">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
                    悔棋
                </button>
                <button class="btn btn-secondary" id="btnRedo">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
                    前进
                </button>
                <button class="btn btn-secondary" id="btnAiHint" style="grid-column: span 2;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                    AI 代下 / 提示
                </button>
            </div>

            <div class="btn-grid">
                <button class="btn btn-secondary" id="btnExportSgf">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    导出 SGF
                </button>
                <button class="btn btn-secondary" id="btnImportSgf">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    导入 SGF
                </button>
                <input type="file" id="sgfFileInput" accept=".sgf" style="display: none;">
            </div>
        </div>
    </div>
</main>

<div class="modal-overlay" id="gameOverModal">
    <div class="modal-card">
        <div class="modal-title" id="modalTitle">对局结束</div>
        <div class="modal-desc" id="modalDesc">黑方达成五连获胜！</div>
        <button class="btn btn-primary" id="modalBtnRestart" style="width: 100%;">再来一局</button>
    </div>
</div>

<script>
    const BOARD_SIZE = 15;
    let canvas, ctx;
    let cellWidth = 38;
    let boardPadding = 48;

    let gameState = {
        board: new Array(225).fill(0),
        history: [],
        status: "IN_PROGRESS",
        sideToMove: 1,
        humanColor: 1,
        ruleMode: 0,
        lastMove: -1,
        canUndo: false,
        canRedo: false,
        ai: {
            score: 0,
            winRate: 50.0,
            depth: 0,
            nodes: 0,
            nps: 0,
            elapsedMs: 0,
            isVCF: false,
            isBook: false,
            openingName: "",
            pv: []
        }
    };

    let hoverCell = { x: -1, y: -1 };
    let isThinking = false;
    let selectedTimeSec = 3;
    let showMoveNumbers = true;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playStoneSound() {
        try {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(480, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.07);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2400, now);
            filter.frequency.linearRampToValueAtTime(400, now + 0.07);

            gain.gain.setValueAtTime(0.7, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.08);
        } catch (e) {}
    }

    function playWinSound() {
        try {
            initAudio();
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, now + i * 0.1);
                gain.gain.linearRampToValueAtTime(0.3, now + i * 0.1 + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.1);
                osc.stop(now + i * 0.1 + 0.4);
            });
        } catch (e) {}
    }

    function initCanvas() {
        canvas = document.getElementById("boardCanvas");
        ctx = canvas.getContext("2d");

        const dpr = window.devicePixelRatio || 1;
        const width = 630;
        const height = 630;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.scale(dpr, dpr);

        boardPadding = 42;
        cellWidth = (width - boardPadding * 2) / (BOARD_SIZE - 1);

        canvas.addEventListener("mousemove", onMouseMove);
        canvas.addEventListener("mouseleave", () => {
            hoverCell = { x: -1, y: -1 };
            drawBoard();
        });
        canvas.addEventListener("click", onCanvasClick);
    }

    function drawBoard() {
        ctx.clearRect(0, 0, 630, 630);

        const woodGrad = ctx.createRadialGradient(315, 315, 50, 315, 315, 450);
        woodGrad.addColorStop(0, "#e8b87a");
        woodGrad.addColorStop(0.7, "#d49e5c");
        woodGrad.addColorStop(1, "#be8445");
        ctx.fillStyle = woodGrad;
        ctx.fillRect(0, 0, 630, 630);

        ctx.strokeStyle = "rgba(100, 50, 10, 0.06)";
        ctx.lineWidth = 1;
        for (let i = 0; i < 630; i += 4) {
            ctx.beginPath();
            ctx.moveTo(0, i + Math.sin(i * 0.05) * 3);
            ctx.bezierCurveTo(200, i + Math.sin(i * 0.03) * 6, 400, i + Math.cos(i * 0.02) * 5, 630, i);
            ctx.stroke();
        }

        ctx.strokeStyle = "#5a3617";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(boardPadding - 8, boardPadding - 8, (BOARD_SIZE - 1) * cellWidth + 16, (BOARD_SIZE - 1) * cellWidth + 16);

        ctx.strokeStyle = "#42280f";
        ctx.lineWidth = 1.2;

        for (let i = 0; i < BOARD_SIZE; i++) {
            const p = boardPadding + i * cellWidth;
            ctx.beginPath();
            ctx.moveTo(boardPadding, p);
            ctx.lineTo(boardPadding + (BOARD_SIZE - 1) * cellWidth, p);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(p, boardPadding);
            ctx.lineTo(p, boardPadding + (BOARD_SIZE - 1) * cellWidth);
            ctx.stroke();
        }

        const starPoints = [
            { x: 3, y: 3 }, { x: 11, y: 3 },
            { x: 7, y: 7 },
            { x: 3, y: 11 }, { x: 11, y: 11 }
        ];

        ctx.fillStyle = "#331c08";
        starPoints.forEach(pt => {
            const cx = boardPadding + pt.x * cellWidth;
            const cy = boardPadding + pt.y * cellWidth;
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.fillStyle = "#5a3617";
        ctx.font = "600 11px 'JetBrains Mono', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const letters = "ABCDEFGHIJKLMNO";
        for (let i = 0; i < BOARD_SIZE; i++) {
            const pos = boardPadding + i * cellWidth;
            ctx.fillText(letters[i], pos, boardPadding - 20);
            ctx.fillText(letters[i], pos, boardPadding + (BOARD_SIZE - 1) * cellWidth + 20);
            ctx.fillText((15 - i).toString(), boardPadding - 22, pos);
            ctx.fillText((15 - i).toString(), boardPadding + (BOARD_SIZE - 1) * cellWidth + 22, pos);
        }

        for (let y = 0; y < BOARD_SIZE; y++) {
            for (let x = 0; x < BOARD_SIZE; x++) {
                const idx = y * BOARD_SIZE + x;
                const piece = gameState.board[idx];
                if (piece !== 0) {
                    drawStone(x, y, piece, idx);
                }
            }
        }

        if (gameState.lastMove >= 0) {
            const lx = gameState.lastMove % BOARD_SIZE;
            const ly = Math.floor(gameState.lastMove / BOARD_SIZE);
            const cx = boardPadding + lx * cellWidth;
            const cy = boardPadding + ly * cellWidth;

            ctx.strokeStyle = "#e5b95f";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(cx, cy, cellWidth * 0.22, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "#e5b95f";
            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        if (hoverCell.x >= 0 && hoverCell.y >= 0 && !isThinking && gameState.status === "IN_PROGRESS") {
            const hIdx = hoverCell.y * BOARD_SIZE + hoverCell.x;
            if (gameState.board[hIdx] === 0) {
                drawPhantomStone(hoverCell.x, hoverCell.y, gameState.sideToMove);
            }
        }
    }

    function drawStone(x, y, piece, idx) {
        const cx = boardPadding + x * cellWidth;
        const cy = boardPadding + y * cellWidth;
        const radius = cellWidth * 0.44;

        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
        ctx.shadowBlur = 8;
        ctx.shadowOffsetX = 3;
        ctx.shadowOffsetY = 4;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);

        if (piece === 1) {
            const grad = ctx.createRadialGradient(cx - radius * 0.35, cy - radius * 0.35, radius * 0.1, cx, cy, radius);
            grad.addColorStop(0, "#4a5568");
            grad.addColorStop(0.3, "#2d3748");
            grad.addColorStop(0.8, "#1a202c");
            grad.addColorStop(1, "#0a0c10");
            ctx.fillStyle = grad;
            ctx.fill();
        } else {
            const grad = ctx.createRadialGradient(cx - radius * 0.35, cy - radius * 0.35, radius * 0.1, cx, cy, radius);
            grad.addColorStop(0, "#ffffff");
            grad.addColorStop(0.4, "#f8fafc");
            grad.addColorStop(0.8, "#e2e8f0");
            grad.addColorStop(1, "#cbd5e1");
            ctx.fillStyle = grad;
            ctx.fill();
        }

        ctx.restore();

        if (showMoveNumbers) {
            const moveNumber = gameState.history.indexOf(idx) + 1;
            if (moveNumber > 0) {
                ctx.font = "700 " + (cellWidth * 0.32) + "px 'JetBrains Mono', sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = (piece === 1) ? "#f1f5f9" : "#1e293b";
                ctx.fillText(moveNumber.toString(), cx, cy);
            }
        }
    }

    function drawPhantomStone(x, y, piece) {
        const cx = boardPadding + x * cellWidth;
        const cy = boardPadding + y * cellWidth;
        const radius = cellWidth * 0.42;

        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = (piece === 1) ? "#1a202c" : "#f1f5f9";
        ctx.fill();

        ctx.strokeStyle = "#e5b95f";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }

    function onMouseMove(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const x = Math.round((mouseX - boardPadding) / cellWidth);
        const y = Math.round((mouseY - boardPadding) / cellWidth);

        if (x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE) {
            if (hoverCell.x !== x || hoverCell.y !== y) {
                hoverCell = { x, y };
                drawBoard();
            }
        } else if (hoverCell.x !== -1) {
            hoverCell = { x: -1, y: -1 };
            drawBoard();
        }
    }

    function onCanvasClick(e) {
        if (isThinking || gameState.status !== "IN_PROGRESS") return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const x = Math.round((mouseX - boardPadding) / cellWidth);
        const y = Math.round((mouseY - boardPadding) / cellWidth);

        if (x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE) {
            const idx = y * BOARD_SIZE + x;
            if (gameState.board[idx] === 0) {
                makePlayerMove(idx);
            }
        }
    }

    async function fetchState() {
        try {
            const res = await fetch("/api/state");
            const data = await res.json();
            updateGameState(data);
        } catch (e) {
            console.error(e);
        }
    }

    async function makePlayerMove(index) {
        try {
            playStoneSound();
            const res = await fetch("/api/move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ index })
            });
            const data = await res.json();
            updateGameState(data);

            if (data.status === "IN_PROGRESS" && data.sideToMove !== data.humanColor) {
                triggerAiMove();
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function triggerAiMove() {
        isThinking = true;
        updateStatusDisplay();

        try {
            const res = await fetch("/api/ai-move", { method: "POST" });
            const data = await res.json();
            playStoneSound();
            updateGameState(data);
        } catch (e) {
            console.error(e);
        } finally {
            isThinking = false;
            updateStatusDisplay();
        }
    }

    async function requestNewGame() {
        const sideBtn = document.querySelector("#sideToggleGroup .btn-toggle.active");
        const humanColor = parseInt(sideBtn.dataset.color);
        const ruleMode = document.getElementById("ruleSwitch").checked ? 0 : 1;

        try {
            const res = await fetch("/api/new-game", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    humanColor,
                    ruleMode,
                    timeLimitSec: selectedTimeSec
                })
            });
            const data = await res.json();
            hideModal();
            updateGameState(data);
        } catch (e) {
            console.error(e);
        }
    }

    async function requestUndo() {
        try {
            const res = await fetch("/api/undo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ steps: 2 })
            });
            const data = await res.json();
            updateGameState(data);
        } catch (e) {
            console.error(e);
        }
    }

    async function requestRedo() {
        try {
            const res = await fetch("/api/redo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ steps: 1 })
            });
            const data = await res.json();
            updateGameState(data);
        } catch (e) {
            console.error(e);
        }
    }

    function updateGameState(data) {
        gameState = data;
        drawBoard();
        updateUIElements();

        if (gameState.status !== "IN_PROGRESS") {
            showGameOverModal(gameState.status);
        }
    }

    function updateUIElements() {
        const winRate = gameState.ai.winRate || 50.0;
        let blackWinRate = (gameState.sideToMove === 1) ? winRate : (100.0 - winRate);
        blackWinRate = Math.max(1, Math.min(99, blackWinRate));
        const whiteWinRate = 100.0 - blackWinRate;

        document.getElementById("winrateBarBlack").style.width = blackWinRate.toFixed(1) + "%";
        document.getElementById("winrateBlackLabel").innerText = `黑方胜率: ${blackWinRate.toFixed(1)}%`;
        document.getElementById("winrateWhiteLabel").innerText = `白方胜率: ${whiteWinRate.toFixed(1)}%`;

        document.getElementById("hudDepth").innerText = `${gameState.ai.depth} 层` + (gameState.ai.isVCF ? " (绝杀)" : "");
        document.getElementById("hudTime").innerText = `${gameState.ai.elapsedMs} ms`;
        document.getElementById("hudNodes").innerText = Number(gameState.ai.nodes).toLocaleString();
        document.getElementById("hudNps").innerText = `${Number(gameState.ai.nps).toLocaleString()} nps`;

        const openingBadge = document.getElementById("openingNameBadge");
        openingBadge.innerText = gameState.ai.openingName ? `[${gameState.ai.openingName}]` : "";

        const pvEl = document.getElementById("hudPvLine");
        if (gameState.ai.pv && gameState.ai.pv.length > 0) {
            const letters = "ABCDEFGHIJKLMNO";
            const pvStr = gameState.ai.pv.slice(0, 8).map(idx => {
                const x = idx % BOARD_SIZE;
                const y = Math.floor(idx / BOARD_SIZE);
                return `${letters[x]}${15 - y}`;
            }).join(" → ");
            pvEl.innerText = pvStr;
        } else {
            pvEl.innerText = "等待落子...";
        }

        document.getElementById("btnUndo").disabled = !gameState.canUndo || isThinking;
        document.getElementById("btnRedo").disabled = !gameState.canRedo || isThinking;

        updateStatusDisplay();
    }

    function updateStatusDisplay() {
        const dot = document.getElementById("statusDot");
        const text = document.getElementById("statusText");

        if (isThinking) {
            dot.className = "pulse-dot thinking";
            text.innerText = "AI 正在计算中...";
        } else if (gameState.status === "IN_PROGRESS") {
            dot.className = "pulse-dot";
            const isHumanTurn = gameState.sideToMove === gameState.humanColor;
            text.innerText = isHumanTurn ? "轮到您落子" : "等待 AI";
        } else {
            dot.className = "pulse-dot";
            text.innerText = "对局已结束";
        }
    }

    function showGameOverModal(status) {
        playWinSound();
        const modal = document.getElementById("gameOverModal");
        const title = document.getElementById("modalTitle");
        const desc = document.getElementById("modalDesc");

        if (status === "BLACK_WIN") {
            title.innerText = "🎉 黑方获胜！";
            desc.innerText = (gameState.humanColor === 1) ? "恭喜您执黑获得胜利！" : "AI 执黑达成五连获胜。";
        } else if (status === "WHITE_WIN") {
            title.innerText = "🎉 白方获胜！";
            desc.innerText = (gameState.humanColor === 2) ? "恭喜您执白获胜！" : "AI 执白获胜。";
        } else if (status === "BLACK_FOUL_LOSS") {
            title.innerText = "⚠️ 禁手判负！";
            desc.innerText = "黑方触发连珠禁手规则（三三/四四/长连），直接判负！";
        } else if (status === "DRAW") {
            title.innerText = "🤝 和棋";
            desc.innerText = "棋盘已满，双方握手言和。";
        }

        modal.style.display = "flex";
    }

    function hideModal() {
        document.getElementById("gameOverModal").style.display = "none";
    }

    function setupSgfFeatures() {
        document.getElementById("btnExportSgf").addEventListener("click", () => {
            window.location.href = "/api/sgf/export";
        });

        const fileInput = document.getElementById("sgfFileInput");
        document.getElementById("btnImportSgf").addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const text = await file.text();
            try {
                const res = await fetch("/api/sgf/import", {
                    method: "POST",
                    body: text
                });
                const data = await res.json();
                updateGameState(data);
            } catch (err) {
                alert("SGF 导入失败：" + err.message);
            }
            fileInput.value = "";
        });
    }

    function setupEventListeners() {
        document.querySelectorAll("#sideToggleGroup .btn-toggle").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll("#sideToggleGroup .btn-toggle").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                requestNewGame();
            });
        });

        document.querySelectorAll("#timeToggleGroup .btn-toggle").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll("#timeToggleGroup .btn-toggle").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                selectedTimeSec = parseInt(btn.dataset.time);
            });
        });

        document.getElementById("moveNumSwitch").addEventListener("change", (e) => {
            showMoveNumbers = e.target.checked;
            drawBoard();
        });

        document.getElementById("ruleSwitch").addEventListener("change", () => {
            requestNewGame();
        });

        document.getElementById("btnNewGame").addEventListener("click", requestNewGame);
        document.getElementById("modalBtnRestart").addEventListener("click", requestNewGame);
        document.getElementById("btnUndo").addEventListener("click", requestUndo);
        document.getElementById("btnRedo").addEventListener("click", requestRedo);
        document.getElementById("btnAiHint").addEventListener("click", triggerAiMove);

        setupSgfFeatures();
    }

    window.addEventListener("DOMContentLoaded", () => {
        initCanvas();
        setupEventListeners();
        fetchState();
    });
</script>
</body>
</html>
